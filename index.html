<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYC Free Parking Map MVP</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Initialize map centered on Midtown Manhattan
    const map = L.map('map').setView([40.7549, -73.9840], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 2. Demo sample locations (Guarantees visible markers right away)
    const demoSpots = [
      { lat: 40.7549, lng: -73.9840, desc: "FREE PARKING: Sun All Day / Mon-Sat 7PM-7AM", free: true },
      { lat: 40.7558, lng: -73.9832, desc: "NO PARKING: Mon-Fri 8AM-6PM (Commercial)", free: false },
      { lat: 40.7532, lng: -73.9855, desc: "FREE PARKING: Street Clean Tue/Fri 11AM-12:30PM", free: true },
      { lat: 40.7565, lng: -73.9862, desc: "METERED PARKING: $4.50/hr Max 3 Hrs", free: false }
    ];

    demoSpots.forEach(spot => {
      const color = spot.free ? '#2ecc71' : '#ff4d4d';
      L.circleMarker([spot.lat, spot.lng], {
        radius: 8,
        color: '#ffffff',
        weight: 2,
        fillColor: color,
        fillOpacity: 0.9
      })
      .bindPopup(`<b>Parking Rule:</b><br>${spot.desc}`)
      .addTo(map);
    });

    // 3. Live NYC Open Data Fetch
    async function fetchParkingSigns() {
      // Query NYC Sign Locations dataset using SoQL
      const endpoint = "https://data.cityofnewyork.us/resource/pvqr-5b48.json?$limit=5000&$where=latitude%20IS%20NOT%20NULL";

      try {
        const response = await fetch(endpoint);
        const signs = await response.json();

        signs.forEach(sign => {
          if (sign.latitude && sign.longitude) {
            const lat = parseFloat(sign.latitude);
            const lng = parseFloat(sign.longitude);
            const description = sign.sign_description || "Parking Regulation Zone";

            const isRestricted = description.includes("NO PARKING") || description.includes("NO STANDING") || description.includes("METER");
            const color = isRestricted ? '#ff4d4d' : '#2ecc71';

            L.circleMarker([lat, lng], {
              radius: 6,
              color: color,
              fillColor: color,
              fillOpacity: 0.8
            })
            .bindPopup(`<b>Live Sign Rule:</b><br>${description}`)
            .addTo(map);
          }
        });
      } catch (error) {
        console.error("Error fetching NYC sign data:", error);
      }
    }

    fetchParkingSigns();
  </script>
</body>
</html>
