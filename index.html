<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYC Free Parking Map MVP</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize map centered on Midtown Manhattan
    const map = L.map('map').setView([40.7549, -73.9840], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Fetch active parking regulation data from NYC Open Data
    async function fetchParkingSigns() {
      // Query 200 regulation entries near Manhattan
      const endpoint = "https://data.cityofnewyork.us/resource/pvqr-5b48.json?$limit=200";

      try {
        const response = await fetch(endpoint);
        const signs = await response.json();

        signs.forEach(sign => {
          // Check for valid spatial location data
          if (sign.the_geom && sign.the_geom.coordinates) {
            const lng = sign.the_geom.coordinates[0];
            const lat = sign.the_geom.coordinates[1];
            const description = sign.sign_description || "Parking Zone";

            // Color-code: Red for restrictions/meters, Green for free/open rules
            const isRestricted = description.includes("NO PARKING") || description.includes("NO STANDING") || description.includes("METER");
            const color = isRestricted ? '#ff4d4d' : '#2ecc71';

            L.circleMarker([lat, lng], {
              radius: 7,
              color: '#ffffff',
              weight: 1,
              fillColor: color,
              fillOpacity: 0.9
            })
            .bindPopup(`<b>Regulation:</b><br>${description}`)
            .addTo(map);
          }
        });
      } catch (error) {
        console.error("Error fetching NYC sign data:", error);
      }
    }

    fetchParkingSigns();
  </script>
</body>
</html>
